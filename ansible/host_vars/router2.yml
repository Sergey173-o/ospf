---
router_id: 2.2.2.2

ospf_interfaces:
  - ifname: eth1
    description: r1-r2
    ip: 10.0.10.2
    prefix: 30
    network: 10.0.10.0/30
    area: 0
    expensive_when: if_symmetric   # дорогим становится только когда symmetric_routing: true

  - ifname: eth2
    description: r2-r3
    ip: 10.0.11.2
    prefix: 30
    network: 10.0.11.0/30
    area: 0
    expensive_when: never

  - ifname: enp0s10
    description: net2
    ip: 192.168.20.1
    prefix: 24
    network: 192.168.20.0/24
    area: 0
    expensive_when: never

# v2 — 2026-11-07
# Имена транзитных интерфейсов заменены на eth1 и eth2 по выводу стенда.
